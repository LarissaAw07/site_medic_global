<div class="lang" data-lang>
  <button class="lang-btn" type="button" aria-expanded="false" aria-controls="lang-menu" aria-label="Language: English. Change language">{{> flag-us}}<span class="lang-code" aria-hidden="true">EN</span>{{i:chevron-down}}</button>
  <ul class="lang-menu" id="lang-menu" role="list" hidden>
    <li><a href="{{hrefPt}}" hreflang="pt-BR" lang="pt-BR" data-set-lang="pt">{{> flag-br}}<span>Português</span>{{i:check}}</a></li>
    <li><a href="{{hrefEn}}" hreflang="en" lang="en" data-set-lang="en" aria-current="true">{{> flag-us}}<span>English</span>{{i:check}}</a></li>
  </ul>
</div>
