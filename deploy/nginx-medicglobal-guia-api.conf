# Proxy do GUIA MÉDICO ao vivo (igual extremamedic.com/manual/).
# Repassa /guia-api/<x> → https://extremamedic.com/manual/<x> (cidades via buscacidade.php e o manual via manual.php).
# O manual.php é embutido num <iframe> no nosso domínio: por isso removemos X-Frame-Options e injetamos um <base>
# para os assets (css/imagens/logos) carregarem direto de extremamedic. Incluir dentro do server { } do site.
# Requer o módulo ngx_http_sub_filter_module (padrão na maioria dos pacotes nginx).
# Depois: sudo nginx -t && sudo systemctl reload nginx
#
# Usado por assets/js/guia-medico.js na página guia-medico.html.

location /guia-api/ {
  proxy_pass https://extremamedic.com/manual/;
  proxy_ssl_server_name on;                 # SNI para o handshake TLS
  proxy_set_header Host extremamedic.com;
  proxy_set_header X-Requested-With ajax;
  proxy_set_header Accept-Encoding "";        # desliga gzip para o sub_filter poder reescrever o HTML
  proxy_read_timeout 60s;

  # embutir no iframe do nosso domínio
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Content-Security-Policy;

  # injeta <base> logo após o <head> do manual, para os assets relativos (../images, img_guia, css) resolverem em extremamedic.com
  sub_filter_once on;
  sub_filter_types text/html;
  sub_filter '<head>' '<head><base href="https://extremamedic.com/manual/">';
}
