# Trecho para o server { } do site no nginx (os arquivos estáticos continuam servidos direto pelo nginx).
# Depois de incluir: sudo nginx -t && sudo systemctl reload nginx
#
# PRÉ-REQUISITO: as zonas de limite abaixo ficam no bloco http { } (ex.: /etc/nginx/conf.d/medicglobal-limits.conf):
#   limit_req_zone  $binary_remote_addr zone=mg_login:10m rate=10r/m;   # login do painel: 10 tentativas/min por IP
#   limit_req_zone  $binary_remote_addr zone=mg_forms:10m rate=6r/m;    # formulários do site: 6 envios/min por IP
#   limit_conn_zone $binary_remote_addr zone=mg_conn:10m;               # conexões simultâneas por IP
#   limit_req_status 429;
#   limit_conn_status 429;

# painel e API (login, conteúdo, formulários) → servidor Node em 127.0.0.1:8788
location = /admin { proxy_pass http://127.0.0.1:8788; include /etc/nginx/medicglobal-proxy.conf; }
location /admin/  { proxy_pass http://127.0.0.1:8788; include /etc/nginx/medicglobal-proxy.conf; }

# login: limite de tentativas por IP já na entrada (o painel também limita por conta e por rede)
location = /api/admin/login {
  limit_req zone=mg_login burst=5 nodelay;
  proxy_pass http://127.0.0.1:8788;
  include /etc/nginx/medicglobal-proxy.conf;
  client_max_body_size 16k;
}

# formulários públicos (Contato, Ouvidoria, Planos, Newsletter, Trabalhe conosco)
location /api/forms/ {
  limit_req zone=mg_forms burst=3 nodelay;
  limit_conn mg_conn 2;          # no máximo 2 envios ao mesmo tempo por IP
  proxy_pass http://127.0.0.1:8788;
  include /etc/nginx/medicglobal-proxy.conf;
  # anexo do Trabalhe conosco: o formulário bloqueia acima de 1 GB; o servidor aceita até 10 GB.
  # O painel confere limite por IP, envios simultâneos e espaço em disco ANTES de receber o arquivo.
  client_max_body_size 10250m;
  proxy_request_buffering off;   # repassa ao Node enquanto recebe (sem guardar tudo antes)
  client_body_timeout 300s;
  proxy_send_timeout 3600s;
}

# demais rotas do painel (conteúdo, imagens de até 5 MB, PDFs de até 15 MB)
location /api/ {
  limit_conn mg_conn 10;
  proxy_pass http://127.0.0.1:8788;
  include /etc/nginx/medicglobal-proxy.conf;
  client_max_body_size 20m;
}

# SVG enviados pelo painel (logotipo/favicon): nunca executam script, nem se abertos direto no navegador
location ~* ^/assets/uploads/.+\.svg$ {
  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; sandbox" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Cache-Control "public, max-age=3600" always;
}

# /etc/nginx/medicglobal-proxy.conf (criar com o conteúdo abaixo):
#   proxy_http_version 1.1;
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $remote_addr;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_read_timeout 3600s;   # 1 h: tempo para receber um anexo grande
