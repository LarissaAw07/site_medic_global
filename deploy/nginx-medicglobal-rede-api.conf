# Proxy da BUSCA AO VIVO da rede credenciada.
# O sistema oficial (extremamedic.com) não libera CORS, então o navegador não pode chamá-lo direto.
# Este trecho repassa /rede-api/<arquivo.php>?<query>  →  https://extremamedic.com/ajax/<arquivo.php>?<query>
# (mesmo caminho usado pelo serve.js local). Incluir dentro do server { } do site.
# Depois: sudo nginx -t && sudo systemctl reload nginx
#
# Usado por assets/js/rede-busca.live.js na página rede-credenciada.html.

location /rede-api/ {
  proxy_pass https://extremamedic.com/ajax/;
  proxy_ssl_server_name on;                 # SNI: necessário para o handshake TLS com extremamedic.com
  proxy_set_header Host extremamedic.com;
  proxy_set_header X-Requested-With ajax;    # o sistema antigo espera este cabeçalho nas chamadas ajax
  proxy_set_header User-Agent "MedicGLOBAL rede-proxy";
  proxy_read_timeout 60s;

  # Cache leve (opcional): alivia o sistema oficial em buscas repetidas.
  # Requer no http { }:  proxy_cache_path /var/cache/nginx/rede levels=1:2 keys_zone=rede:10m inactive=10m max_size=100m;
  # proxy_cache rede;
  # proxy_cache_valid 200 5m;
  # add_header X-Cache $upstream_cache_status;
}
