<div class="hero-nav">
          <button type="button" data-slide-prev aria-label="Destaque anterior">{{i:chevron-left}}</button>
          <span class="hero-dots" role="group" aria-label="Escolher destaque">
            <button type="button" data-slide-to="0" aria-label="Destaque 1"></button>
            <button type="button" data-slide-to="1" aria-label="Destaque 2"></button>
            <button type="button" data-slide-to="2" aria-label="Destaque 3"></button>
          </span>
          <button type="button" data-slide-next aria-label="Próximo destaque">{{i:chevron-right}}</button>
          <button class="hero-pause" type="button" data-slide-pause aria-pressed="false" aria-label="Pausar rotação">{{i:pause}}{{i:play}}</button>
        </div>
