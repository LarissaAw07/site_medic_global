# Trecho para o server { } do site no nginx (os arquivos estáticos continuam servidos direto pelo nginx).
# Depois de incluir: sudo nginx -t && sudo systemctl reload nginx

# painel e API (login, conteúdo, formulários) → servidor Node em 127.0.0.1:8788
location = /admin { proxy_pass http://127.0.0.1:8788; include /etc/nginx/medicglobal-proxy.conf; }
location /admin/  { proxy_pass http://127.0.0.1:8788; include /etc/nginx/medicglobal-proxy.conf; }
location /api/ {
  proxy_pass http://127.0.0.1:8788;
  include /etc/nginx/medicglobal-proxy.conf;
  # imagens do painel (até 5 MB) e anexo do Trabalhe conosco (o formulário bloqueia acima de 1 GB; o servidor aceita até 10 GB)
  client_max_body_size 10250m;
  # anexo grande: repassa ao Node enquanto recebe (sem guardar tudo antes) e tolera conexões lentas
  proxy_request_buffering off;
  client_body_timeout 300s;
  proxy_send_timeout 3600s;
}

